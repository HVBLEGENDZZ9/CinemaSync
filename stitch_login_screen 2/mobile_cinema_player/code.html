<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      line-height: 1;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
    }
    .cinematic-scrim {
      background: linear-gradient(to bottom, rgba(19, 19, 19, 0) 0%, rgba(19, 19, 19, 1) 100%);
    }
    .film-grain {
      position: relative;
    }
    .film-grain::after {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      mix-blend-mode: overlay;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background font-body min-h-screen selection:bg-primary selection:text-on-primary">
<!-- TopAppBar Navigation Shell -->
<header class="fixed top-0 w-full z-50 bg-[#131313]/70 backdrop-blur-xl flex justify-between items-center px-6 py-4 w-full shadow-[0_40px_60px_rgba(14,14,14,0.04)]">
<div class="flex items-center gap-3">
<div class="relative">
<img alt="User Avatar" class="w-10 h-10 rounded-full border border-primary/20 object-cover" data-alt="Close-up portrait of a stylish young man with soft cinematic lighting and a dark blurred background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCWOcxuVXGNJFEiTlfBIsJ23gEeBqz0SBnepiquW-0Hwh-Fv4ZPfDr-XdYZay9aTdNxlPCLLe3RdWTF2-N-DCuCOeNJe8UiPytAkVFFATHuTWP5ZAkpTtfIX3k4wXHkivnnJlt9vmy67ZH3pKAtgMLQXpGgbLF3gRSARnp7n3eVzByTMlJkdazBFx45VDeQ3yfj0l6q4qxhScWOC4Xhw69bHg7SQGD-i64IZQy1RdYfl7rLt7x7eo3y3hFwmmpXjqCNUwfyJnt7bw"/>
<span class="absolute bottom-0 right-0 w-3 h-3 bg-primary rounded-full border-2 border-background" title="Partner status indicator"></span>
</div>
<span class="text-xl font-bold tracking-tighter text-[#e9c349] font-headline">Midnight Cinema</span>
</div>
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-[#e9c349] hover:opacity-80 transition-opacity duration-300 active:scale-95 transition-transform ease-out duration-300">sensors</button>
</div>
</header>
<main class="pt-20 pb-28 min-h-screen flex flex-col film-grain">
<!-- Immersive Video Player Section -->
<section class="w-full aspect-video md:aspect-[21/9] bg-surface-container-lowest relative group">
<div class="absolute inset-0 flex items-center justify-center">
<img alt="Cinematic Movie Still" class="w-full h-full object-cover opacity-60" data-alt="Atmospheric cinematic shot of a neon-lit city street at night with heavy rain and dramatic reflections" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBFA5mv-LUVlxMZNTpdI268h9ZPVt6HTDDaBgNjpg8YG7S0-4FzsPh0seg8TwLnk2stnu2RdYsN5A37tMKeGMgerqQXee5nai5c05g7UzJMTfeJ7H4QeYv0GQrP1BmRwSCYcdEqidfT4hB7nwy548TtuamXzsjQL5fE_u1wOn7u2ZYS50Dcu1nETBNR3bkKliTxJnsvBHg6auPMO3hFOEfL9SM94qK5UoDc2JBJScdjkxMtcD44c7531W_cPBn26jlwyeNsm9va2g"/>
<div class="absolute inset-0 bg-gradient-to-t from-background via-transparent to-transparent"></div>
<button class="w-20 h-20 rounded-full bg-primary/90 text-on-primary flex items-center justify-center shadow-2xl transition-transform duration-300 hover:scale-105 active:scale-90">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
</div>
<!-- Player Controls Scrim -->
<div class="absolute bottom-0 left-0 w-full p-6 flex items-center justify-between opacity-0 group-hover:opacity-100 transition-opacity duration-500">
<div class="flex gap-4 items-center">
<span class="material-symbols-outlined text-on-surface">volume_up</span>
<div class="w-32 h-1 bg-surface-variant rounded-full overflow-hidden">
<div class="w-2/3 h-full bg-primary"></div>
</div>
</div>
<span class="material-symbols-outlined text-on-surface">fullscreen</span>
</div>
</section>
<!-- Header & Info -->
<section class="px-6 py-8">
<div class="flex flex-col gap-1">
<h1 class="text-3xl md:text-5xl font-extrabold font-headline tracking-tighter text-on-surface leading-tight">The Midnight Gallery</h1>
<p class="text-sm md:text-base font-label uppercase tracking-widest text-primary font-medium flex items-center gap-2">
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
          WATCHING WITH JULIAN R.
        </p>
</div>
</section>
<!-- Sync Input Area -->
<section class="px-6 flex flex-col gap-6 flex-grow">
<div class="bg-surface-container-low rounded-xl p-1.5 flex items-center gap-2 shadow-inner border border-outline-variant/10">
<input class="bg-transparent border-none focus:ring-0 flex-grow px-4 text-on-surface placeholder:text-on-tertiary-container font-body text-sm" placeholder="Paste video URL to sync..." type="text"/>
<button class="bg-primary text-on-primary px-6 py-2.5 rounded-lg font-bold text-xs tracking-widest uppercase hover:opacity-90 transition-all active:scale-95">
          LOAD
        </button>
</div>
<!-- Bento Grid Features (Desktop Enhancement / Visual Texture) -->
<div class="grid grid-cols-2 gap-4 mt-4">
<div class="bg-surface-container rounded-2xl p-5 flex flex-col justify-between aspect-square">
<span class="material-symbols-outlined text-primary text-3xl">history</span>
<div>
<h3 class="font-headline font-bold text-on-surface">History</h3>
<p class="text-xs text-on-surface-variant">Revisit your shared sessions</p>
</div>
</div>
<div class="bg-surface-container rounded-2xl p-5 flex flex-col justify-between aspect-square">
<span class="material-symbols-outlined text-primary text-3xl">group_add</span>
<div>
<h3 class="font-headline font-bold text-on-surface">Invite</h3>
<p class="text-xs text-on-surface-variant">Add more friends to sync</p>
</div>
</div>
</div>
</section>
</main>
<!-- Contextual Floating Action Button -->
<button class="fixed bottom-24 right-6 w-14 h-14 bg-surface-container-highest/80 backdrop-blur-md rounded-full flex items-center justify-center shadow-2xl border border-outline-variant/20 active:scale-90 transition-transform duration-300 group">
<span class="material-symbols-outlined text-[#e9c349] group-hover:scale-110 transition-transform">chat_bubble</span>
</button>
<!-- BottomNavBar Navigation Shell -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-8 pb-8 pt-4 bg-[#131313]/70 backdrop-blur-xl rounded-t-2xl shadow-[0_-10px_40px_rgba(14,14,14,0.2)]">
<a class="flex flex-col items-center justify-center text-[#e9c349] bg-[#e9c349]/10 rounded-xl px-4 py-1 active:scale-90 transition-transform ease-in-out" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">movie_filter</span>
<span class="font-inter tracking-wide text-[10px] uppercase mt-1">Gallery</span>
</a>
<a class="flex flex-col items-center justify-center text-[#c4c7c7] opacity-60 hover:text-[#ffdf9e] transition-colors duration-300" href="#">
<span class="material-symbols-outlined">sync</span>
<span class="font-inter tracking-wide text-[10px] uppercase mt-1">Sync</span>
</a>
<a class="flex flex-col items-center justify-center text-[#c4c7c7] opacity-60 hover:text-[#ffdf9e] transition-colors duration-300" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="font-inter tracking-wide text-[10px] uppercase mt-1">Settings</span>
</a>
</nav>
</body></html>
