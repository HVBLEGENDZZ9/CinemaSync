<body class="font-body selection:bg-primary/30 min-h-screen flex flex-col justify-center items-center px-6 cinematic-grain overflow-hidden">
<!-- Background Cinematic Scrim/Visual -->
<div class="fixed inset-0 -z-10 overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-t from-background via-background/90 to-transparent"></div>
<img class="w-full h-full object-cover scale-110 opacity-30 grayscale" data-alt="abstract moody cinematic theater interior with deep shadows and subtle golden dust motes floating in warm light beams" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBNrQCXqJ9zKBGK-ZHSFYOp8jutbmfvdC9y9jNpS4BMC7NGpjFlEJ-gXCGGYlN7BsywoX6-j1GnblCJ1qKGcS6e2cWYgq7Ro3UpEm6GqnC7RNsslVjHXcq6ZDzx0n-GcZRs2Tt9nyyRkuwrSCxuZ2mg9IlQ4qbaPhUap1phyUBtkFuEvEsPEndlnMHZhY-XFwhUskrQPwlm0Fa4aSYGwl6VLGfA43x3PoA6qVep_v05Z0ia7E6L4uMV0TzZbkcL-fP-R82-WhfNYw"/>
</div>
<!-- Header / Brand -->
<header class="mb-12 text-center">
<h1 class="font-headline font-extrabold text-3xl tracking-tighter text-primary">
            CinemaSync
        </h1>
<div class="w-8 h-px bg-primary/40 mx-auto mt-2"></div>
</header>
<!-- Main Login Card (Glassmorphic) -->
<main class="w-full max-w-sm">
<div class="bg-surface-container/60 backdrop-blur-2xl p-8 rounded-xl shadow-[0_40px_60px_rgba(0,0,0,0.5)] outline outline-1 outline-white/5 relative">
<div class="mb-10">
<h2 class="font-headline text-2xl font-bold text-on-surface tracking-tight">Welcome Back</h2>
<p class="text-on-surface-variant text-sm mt-1 font-light tracking-wide uppercase opacity-70">Private Session Access</p>
</div>
<form action="#" class="space-y-6">
<!-- Email Field -->
<div class="space-y-1.5">
<label class="block text-[10px] uppercase tracking-[0.15em] text-on-surface-variant ml-1" for="identity">Identity</label>
<div class="relative group">
<input class="w-full bg-surface-container-low border-none rounded-lg py-4 px-5 text-on-surface placeholder:text-on-surface-variant/40 focus:ring-0 focus:bg-surface-container-highest transition-colors duration-300 font-light" id="identity" placeholder="Email Address" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1.5">
<label class="block text-[10px] uppercase tracking-[0.15em] text-on-surface-variant ml-1" for="access_key">Access Key</label>
<div class="relative group">
<input class="w-full bg-surface-container-low border-none rounded-lg py-4 px-5 text-on-surface placeholder:text-on-surface-variant/40 focus:ring-0 focus:bg-surface-container-highest transition-colors duration-300 font-light" id="access_key" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-secondary text-on-primary font-bold py-4 rounded-lg flex items-center justify-center space-x-2 transition-all duration-300 active:scale-[0.98] mt-4 shadow-xl shadow-primary/10" type="submit">
<span class="tracking-tight">Enter Room</span>
<span class="material-symbols-outlined text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Decorative Element -->
<div class="absolute -top-4 -right-4 w-12 h-12 border-t-2 border-r-2 border-primary/20 rounded-tr-xl"></div>
</div>
</main>
<!-- Footer Quote -->
<footer class="mt-16 max-w-[200px]">
<p class="text-center font-body text-xs text-on-surface-variant leading-relaxed italic opacity-40">
            "The screening room is private. For two only."
        </p>
<div class="flex justify-center space-x-4 mt-8 opacity-20">
<span class="material-symbols-outlined text-sm" data-icon="circle" data-weight="fill">circle</span>
<span class="material-symbols-outlined text-sm" data-icon="circle" data-weight="fill">circle</span>
</div>
</footer>
<!-- Decorative light flare -->
<div class="fixed -bottom-40 -left-40 w-96 h-96 bg-primary/10 blur-[120px] rounded-full pointer-events-none"></div>
</body></html>
