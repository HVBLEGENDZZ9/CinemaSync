<body class="bg-background text-on-background font-body min-h-screen flex flex-col items-center justify-between cinematic-glow overflow-hidden">
<!-- Top Navigation Anchor (Suppressed shell, but using identity from JSON) -->
<header class="w-full flex justify-center pt-16 animate-fade-in">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">theaters</span>
<h1 class="font-headline text-2xl font-bold tracking-tighter text-on-surface">CinemaSync</h1>
</div>
</header>
<!-- Main Login Canvas -->
<main class="w-full max-w-md px-6 flex flex-col items-center">
<!-- The Glassmorphic Form Container -->
<div class="glass-panel w-full p-10 rounded-xl border border-outline-variant/10 shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
<div class="mb-10 text-center">
<h2 class="font-headline text-3xl font-light tracking-tight text-on-surface mb-2">Welcome Back</h2>
<p class="text-on-surface-variant font-label text-xs uppercase tracking-[0.2rem]">Private Session Access</p>
</div>
<form class="space-y-6">
<!-- Email Input Group -->
<div class="space-y-2">
<label class="font-label text-[10px] uppercase tracking-widest text-on-tertiary-container ml-1" for="email">Identity</label>
<div class="relative">
<input class="w-full bg-surface-container-low/50 border border-outline-variant/20 rounded-lg py-4 px-5 text-on-surface placeholder:text-on-tertiary-container focus:outline-none focus:ring-1 focus:ring-primary/30 focus:border-primary/30 focus:bg-surface-container-highest/40 transition-all duration-300 font-body text-sm tracking-wide" id="email" placeholder="Email Address" type="email"/>
</div>
</div>
<!-- Password Input Group -->
<div class="space-y-2">
<label class="font-label text-[10px] uppercase tracking-widest text-on-tertiary-container ml-1" for="password">Access Key</label>
<div class="relative">
<input class="w-full bg-surface-container-low/50 border border-outline-variant/20 rounded-lg py-4 px-5 text-on-surface placeholder:text-on-tertiary-container focus:outline-none focus:ring-1 focus:ring-primary/30 focus:border-primary/30 focus:bg-surface-container-highest/40 transition-all duration-300 font-body text-sm tracking-wide" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary Action -->
<div class="pt-4">
<button class="w-full bg-primary hover:bg-secondary text-on-primary font-headline font-bold py-4 rounded-lg shadow-[0_4px_20px_rgba(233,195,73,0.15)] active:scale-[0.98] transition-all duration-500 flex items-center justify-center gap-2 group" type="submit">
                        Enter Room
                        <span class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform duration-300">arrow_forward</span>
</button>
</div>
</form>
</div>
<!-- Decorative Cinematic Scrim Element (Visual Depth) -->
<div class="mt-12 flex items-center gap-4 opacity-20">
<div class="h-[1px] w-12 bg-gradient-to-r from-transparent to-on-surface-variant"></div>
<span class="material-symbols-outlined text-xs">fiber_manual_record</span>
<div class="h-[1px] w-12 bg-gradient-to-l from-transparent to-on-surface-variant"></div>
</div>
</main>
<!-- Bottom Footer (Semantic Logic: The Private Disclaimer) -->
<footer class="w-full flex flex-col items-center pb-12 px-6">
<p class="font-body text-on-surface-variant/60 text-[13px] tracking-[0.05rem] italic text-center">
            "The screening room is private. For two only."
        </p>
<!-- Subtle Ambient Indicator -->
<div class="mt-6 flex gap-2">
<div class="w-1.5 h-1.5 rounded-full bg-primary/40 animate-pulse"></div>
<div class="w-1.5 h-1.5 rounded-full bg-primary/20"></div>
</div>
</footer>
